<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <!-- Soft shadow effect -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Metallic gradient for paperclip -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E0E6ED"/>
      <stop offset="50%" stop-color="#9BA8B7"/>
      <stop offset="75%" stop-color="#D1D9E0"/>
      <stop offset="100%" stop-color="#7B8B9A"/>
    </linearGradient>
    
    <linearGradient id="eye-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Main Outer Paperclip Loop -->
    <path d="M 35,95 
             L 35,35 
             A 18,18 0 0,1 71,35 
             L 71,85 
             A 24,24 0 0,1 23,85 
             L 23,25 
             A 14,14 0 0,1 51,25 
             L 51,75" 
          fill="none" 
          stroke="url(#silver-grad)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <path d="M 35,95 
             L 35,35 
             A 18,18 0 0,1 71,35 
             L 71,85 
             A 24,24 0 0,1 23,85 
             L 23,25 
             A 14,14 0 0,1 51,25 
             L 51,75" 
          fill="none" 
          stroke="#4A5568" 
          stroke-width="1" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.4"/>

    <!-- Left Googly Eye -->
    <g transform="translate(32, 42)">
      <ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#eye-shine)" stroke="#2B3648" stroke-width="1.5"/>
      <ellipse cx="1" cy="2" rx="4.5" ry="5.5" fill="#1A202C"/>
      <circle cx="-1.5" cy="-2.5" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Right Googly Eye -->
    <g transform="translate(52, 42)">
      <ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#eye-shine)" stroke="#2B3648" stroke-width="1.5"/>
      <ellipse cx="0" cy="2" rx="4.5" ry="5.5" fill="#1A202C"/>
      <circle cx="-2.5" cy="-2.5" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Cute Eyebrows -->
    <path d="M 23,28 Q 32,24 39,30" fill="none" stroke="#2B3648" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 46,30 Q 53,24 62,28" fill="none" stroke="#2B3648" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 36,60 Q 42,67 48,60" fill="none" stroke="#2B3648" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
