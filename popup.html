<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>
  <style>

    /* ── Variables ──────────────────────────────── */
    :root {
      --font: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      /* Vista Diamond/Jade Grün */
      --glass-border: rgba(255, 255, 255, 0.62);
      --text-dark:    rgba(10, 35, 15, 0.92);
      --text-mid:     rgba(30, 80, 40, 0.78);
      --aero-green-1: #3d7a4a;   /* hell */
      --aero-green-2: #1e4d28;   /* mittel */
      --aero-green-3: #0f2e16;   /* dunkel */
      --aero-border:  rgba(20, 80, 35, 0.75);
    }

    /* ── Reset ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Body / Vista Aero Grass Background ─────── */
    body {
      width: 260px;
      min-height: 60px;
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-dark);
      /*
        Vista "Diamond" Hintergrund-Simulation:
        - Dunkelgrüner Boden
        - Aurora-Glow in der Mitte (hellgrün/türkis)
        - Hellere obere Zone mit weißlichem Schimmer
      */
      background:
        /* Heller Schimmer oben links */
        radial-gradient(ellipse at 25% 10%, rgba(160, 230, 160, 0.45) 0%, transparent 50%),
        /* Aurora-Glow Mitte */
        radial-gradient(ellipse at 60% 45%, rgba(80, 180, 100, 0.38) 0%, transparent 55%),
        /* Türkis-Highlight rechts oben */
        radial-gradient(ellipse at 90% 15%, rgba(60, 180, 140, 0.30) 0%, transparent 45%),
        /* Hauptverlauf: dunkelgrün unten → mittelgrün → hellgrün oben */
        linear-gradient(175deg,
          #b8dfc0 0%,
          #7ab98a 18%,
          #4a9660 38%,
          #2a6640 58%,
          #1a4a2c 78%,
          #0e3020 100%);
      overflow: hidden;
    }

    /* ── Main Panel ─────────────────────────────── */
    .popup-panel {
      margin: 8px;
      border-radius: 10px;
      /* Leicht grünlicher Glaseffekt */
      background: rgba(200, 235, 210, 0.38);
      backdrop-filter: blur(18px) saturate(1.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow:
        /* Äußerer dunkelgrüner Rand – das "Diamond"-Merkmal */
        0 0 0 2px  rgba(15, 60, 25, 0.55),
        0 4px 18px rgba(10, 50, 20, 0.40),
        inset 0 1px 0 rgba(255, 255, 255, 0.88),
        inset 0 -1px 0 rgba(60, 140, 80, 0.30);
      overflow: hidden;
    }

    /* ── Titlebar ───────────────────────────────── */
    .popup-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 5px;
      /* Vista Aero Titelleiste: grüner Verlauf */
      background: linear-gradient(180deg,
        rgba(160, 215, 170, 0.95) 0%,
        rgba(90,  165, 110, 0.82) 45%,
        rgba(55,  130,  75, 0.90) 55%,
        rgba(110, 185, 130, 0.85) 100%);
      border-bottom: 1px solid rgba(20, 80, 35, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);
      user-select: none;
      position: relative;
    }
    .popup-titlebar::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 10px 10px 0 0;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .titlebar-icon { font-size: 13px; line-height: 1; }
    .titlebar-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: rgba(8, 35, 12, 0.95);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.50);
    }

    /* Window controls */
    .wc-group { display: flex; gap: 4px; }
    .wc-btn {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.22);
      font-size: 0;          /* hide text, show only color */
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.26), inset 0 1px 0 rgba(255,255,255,0.60);
      transition: filter 0.12s;
    }
    .wc-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; width: 80%; height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.04) 100%);
      border-radius: 50%;
    }
    .wc-btn:hover { filter: brightness(1.15); }
    .wc-close    { background: radial-gradient(circle at 40% 38%, #ff7070, #c01515); }
    .wc-minimize { background: radial-gradient(circle at 40% 38%, #ffe070, #c09000); }
    .wc-maximize { background: radial-gradient(circle at 40% 38%, #70ea70, #15a815); }

    /* ── Body Content ───────────────────────────── */
    .popup-body {
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* ── Primary Jelly Button (Toggle Chat) ─────── */
    .btn-primary {
      position: relative;
      width: 100%;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(20, 80, 35, 0.70);
      background: linear-gradient(180deg,
        rgba(130, 210, 150, 0.90) 0%,
        rgba(65,  160,  90, 0.80) 44%,
        rgba(35,  120,  60, 0.88) 56%,
        rgba(100, 190, 120, 0.85) 100%);
      box-shadow:
        0 0 10px rgba(30, 130, 60, 0.35),
        0 3px 8px rgba(10, 70, 25, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.72),
        inset 0 -1px 0 rgba(15, 70, 30, 0.40);
      font-family: var(--font);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(5, 25, 10, 0.95);
      cursor: pointer;
      overflow: hidden;
      transition: filter 0.12s, transform 0.08s, box-shadow 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    /* Specular sheen */
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0; left: 6%; width: 88%; height: 48%;
      background: linear-gradient(180deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.06) 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      pointer-events: none;
    }
    .btn-primary:hover  { filter: brightness(1.08); }
    .btn-primary:active { transform: scale(0.97); box-shadow: 0 1px 4px rgba(10,70,25,0.30), inset 0 1px 0 rgba(255,255,255,0.60); }

    /* ── Secondary Jelly Button (Options) ───────── */
    .btn-secondary {
      position: relative;
      width: 100%;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(100, 180, 120, 0.50);
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.72) 0%,
        rgba(195, 235, 205, 0.50) 44%,
        rgba(155, 215, 170, 0.62) 56%,
        rgba(200, 235, 210, 0.68) 100%);
      box-shadow:
        0 2px 6px rgba(20, 100, 45, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        inset 0 -1px 0 rgba(60, 150, 80, 0.25);
      font-family: var(--font);
      font-size: 10.5px;
      font-weight: 600;
      color: rgba(8, 40, 15, 0.90);
      cursor: pointer;
      overflow: hidden;
      transition: filter 0.12s, transform 0.08s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-secondary::before {
      content: '';
      position: absolute;
      top: 0; left: 8%; width: 84%; height: 48%;
      background: linear-gradient(180deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.06) 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      pointer-events: none;
    }
    .btn-secondary:hover  { filter: brightness(1.06); }
    .btn-secondary:active { transform: scale(0.97); }

    /* ── Divider ─────────────────────────────────── */
    .popup-divider {
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(40, 120, 60, 0.35) 20%,
        rgba(40, 120, 60, 0.35) 80%,
        transparent 100%);
      margin: 0 4px;
    }

    /* ── Status line ─────────────────────────────── */
    .popup-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 10px;
      color: rgba(15, 60, 25, 0.75);
      padding: 0 4px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #70ea70, #18b018);
      box-shadow: 0 0 5px rgba(30, 180, 30, 0.55);
      flex-shrink: 0;
    }

  </style>
</head>
<body>

  <div class="popup-panel">

    <!-- Titlebar -->
    <div class="popup-titlebar">
      <div class="titlebar-left">
        <span class="titlebar-icon">✨</span>
        <span class="titlebar-title">Gemini Chat</span>
      </div>
      <div class="wc-group">
        <button class="wc-btn wc-minimize" title="Minimize"></button>
        <button class="wc-btn wc-maximize" title="Maximize"></button>
        <button class="wc-btn wc-close"    title="Close" id="btn-close-popup"></button>
      </div>
    </div>

    <!-- Body -->
    <div class="popup-body">

      <!-- Status -->
      <div class="popup-status">
        <span class="status-dot"></span>
        <span id="status-text">Bereit</span>
      </div>

      <div class="popup-divider"></div>

      <!-- Primary action -->
      <button class="btn-primary" id="toggleChat">
        <span>💬</span>
        <span>Gemini Chat öffnen</span>
      </button>

      <!-- Secondary: open options -->
      <button class="btn-secondary" id="btn-options">
        <span>⚙️</span>
        <span>Einstellungen</span>
      </button>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
